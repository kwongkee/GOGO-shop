# ============================================
# GOGO-shop 智能CI/CD Workflow
# 技术栈: PHP / MySQL
# 功能: 代码审核 → 修复建议 → 自动修复 → 测试 → 部署
# 通知: 钉钉 + 邮件
# ============================================

name: GOGO-shop Smart CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PROJECT_NAME: gogo-shop
  PROJECT_PATH: /www/wwwroot/gogo198shop
  SERVER_IP: 39.108.11.214
  SONAR_PROJECT_KEY: gogo-shop

jobs:
  # ==================== 阶段1: 代码审核 ====================
  code-review:
    name: 代码审核
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置PHP环境
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.2'
          extensions: pdo_mysql, mbstring, xml, session, gd, curl
          coverage: none

      - name: SonarQube扫描
        run: |
          if ! command -v sonar-scanner &> /dev/null; then
            wget -q https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.8.0.2856-linux.zip -O /tmp/sonar.zip
            unzip -o /tmp/sonar.zip -d /opt
          fi
          
          /opt/sonar-scanner-4.8.0.2856-linux/bin/sonar-scanner \
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }} \
            -Dsonar.sources=. \
            -Dsonar.host.url=http://${{ env.SERVER_IP }}:9001 \
            -Dsonar.login=${{ secrets.SONAR_TOKEN_SHOP }} \
            -Dsonar.php.exclusions=data/**,attachment/**,images/**
        continue-on-error: true

      - name: PHP语法检查
        run: |
          echo "检查PHP语法..."
          ERROR_COUNT=0
          for file in $(find . -name "*.php" -type f | grep -v vendor | grep -v data | head -100); do
            result=$(php -l "$file" 2>&1)
            if ! echo "$result" | grep -q "No syntax errors"; then
              echo "❌ 语法错误: $file"
              ERROR_COUNT=$((ERROR_COUNT + 1))
            fi
          done
          if [ "$ERROR_COUNT" -eq 0 ]; then
            echo "✅ PHP语法检查通过"
          else
            echo "❌ 发现 $ERROR_COUNT 个语法错误"
            exit 1
          fi

      - name: 安全检查
        run: |
          echo "检查敏感文件..."
          if find . -name ".env" -type f | grep -q .; then
            echo "⚠️ 警告: 发现.env文件"
          fi
          if find . -name "config*.php" -path "*/application/*" | xargs grep -l "password" 2>/dev/null | grep -q .; then
            echo "⚠️ 警告: 发现可能含密码的配置文件"
          fi

      - name: 保存审核结果
        run: |
          echo "审核完成"
          echo "commit=${{ github.sha }}" > review_summary.txt
          echo "branch=${{ github.ref }}" >> review_summary.txt
          echo "actor=${{ github.actor }}" >> review_summary.txt

      - name: 上传审核结果
        uses: actions/upload-artifact@v4
        with:
          name: gogo-shop-review-results
          path: review_summary.txt

  # ==================== 阶段2: 生成修复建议 ====================
  generate-fix-suggestions:
    name: 生成修复建议
    runs-on: ubuntu-latest
    needs: code-review
    if: github.event_name == 'push'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 获取SonarQube问题
        run: |
          echo "# GOGO-shop 修复建议报告" > fix-suggestions.md
          echo "" >> fix-suggestions.md
          echo "**提交信息**" >> fix-suggestions.md
          echo "- Commit: \`${{ github.sha }}\`" >> fix-suggestions.md
          echo "- 分支: ${{ github.ref }}" >> fix-suggestions.md
          echo "- 作者: ${{ github.actor }}" >> fix-suggestions.md
          echo "" >> fix-suggestions.md
          
          curl -s -u "${{ secrets.SONAR_TOKEN_SHOP }}:" \
            "http://${{ env.SERVER_IP }}:9001/api/issues/search?component=gogo-shop&statuses=OPEN" \
            > sonar-issues.json 2>/dev/null || echo "{}" > sonar-issues.json
          
          ISSUE_COUNT=$(cat sonar-issues.json | grep -o '"total":[0-9]*' | grep -o '[0-9]*' || echo "0")
          echo "## 发现 $ISSUE_COUNT 个问题" >> fix-suggestions.md
          echo "" >> fix-suggestions.md
          
          if [ "$ISSUE_COUNT" -gt 0 ]; then
            echo "请访问 SonarQube 查看完整报告:" >> fix-suggestions.md
            echo "" >> fix-suggestions.md
            echo "👉 http://${{ env.SERVER_IP }}:9001/project/issues?id=gogo-shop" >> fix-suggestions.md
          else
            echo "✅ 代码质量良好，未发现明显问题" >> fix-suggestions.md
          fi

      - name: 创建GitHub Issue
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('fix-suggestions.md', 'utf8');
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📋 代码审核报告 - ${{ github.sha }}`,
              body: content,
              labels: ['code-review', 'automated', 'gogo-shop']
            });

      - name: 上传修复建议
        uses: actions/upload-artifact@v4
        with:
          name: gogo-shop-fix-suggestions
          path: fix-suggestions.md

  # ==================== 阶段3: 自动修复 ====================
  auto-fix:
    name: 自动修复
    runs-on: ubuntu-latest
    needs: [code-review, generate-fix-suggestions]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置PHP环境
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.2'

      - name: 执行自动修复
        run: |
          echo "执行自动修复..."
          
          FIX_BRANCH="fix/auto-fix-$(date +%Y%m%d%H%M%S)"
          git checkout -b "$FIX_BRANCH"
          
          # 修复空白字符
          find . -name "*.php" -exec sed -i 's/[[:space:]]*$//' {} \; 2>/dev/null || true
          
          # 修复PHP短标签
          find . -name "*.php" -exec sed -i 's/<? /<?php /g' {} \; 2>/dev/null || true
          
          MODIFIED=$(git diff --name-only | wc -l)
          echo "修改了 $MODIFIED 个文件"

      - name: 提交修复
        run: |
          if ! git diff --quiet; then
            git config user.name "CI Bot"
            git config user.email "ci@gogo.com"
            git add -A
            git commit -m "chore: auto-fix code issues"
            git push -u origin HEAD || true
            echo "fix_status=committed" >> $GITHUB_OUTPUT
          else
            echo "fix_status=no_changes" >> $GITHUB_OUTPUT
          fi
        id: commit_fix

      - name: 创建修复PR
        if: steps.commit_fix.outputs.fix_status == 'committed'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "🔧 自动修复: 代码质量问题",
              body: `自动修复常见代码问题\n\n来源: \`${{ github.sha }}\``,
              head: "fix/auto-fix-$(date +%Y%m%d%H%M%S)",
              base: 'main'
            });

  # ==================== 阶段4: Docker测试 ====================
  docker-test:
    name: Docker测试
    runs-on: ubuntu-latest
    needs: [code-review, auto-fix]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 构建测试
        run: |
          if [ -f "/opt/docker/gogo-shop/Dockerfile" ]; then
            docker build -t gogo-shop:test /opt/docker/gogo-shop/ || echo "Docker构建跳过"
          fi

  # ==================== 阶段5: 部署 ====================
  deploy:
    name: 部署到服务器
    runs-on: ubuntu-latest
    needs: [docker-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 部署到服务器
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 10m
          script: |
            set -e
            echo "=========================================="
            echo "  GOGO-shop 部署开始"
            echo "  时间: $(date '+%Y-%m-%d %H:%M:%S')"
            echo "=========================================="
            
            PROJECT_PATH="${{ env.PROJECT_PATH }}"
            
            # 备份
            mkdir -p /opt/backups/gogo-shop
            tar -czf /opt/backups/gogo-shop/backup_$(date +%Y%m%d_%H%M%S).tar.gz -C "$PROJECT_PATH" . --exclude='.git' 2>/dev/null || true
            
            # 部署
            cd "$PROJECT_PATH"
            git fetch origin
            git reset --hard origin/main
            
            chmod -R 755 "$PROJECT_PATH"
            chmod -R 777 "$PROJECT_PATH/data" 2>/dev/null || true
            
            systemctl reload php-fpm 2>/dev/null || /etc/init.d/php-fpm reload 2>/dev/null || true
            nginx -t && nginx -s reload 2>/dev/null || true
            
            echo "${{ github.sha }}" > "$PROJECT_PATH/.deployed_version"
            echo "$(date '+%Y-%m-%d %H:%M:%S') | ${{ github.sha }} | ${{ github.actor }} | CI/CD Deploy" >> "$PROJECT_PATH/.deployment_history"
            
            echo "✅ 部署完成! 访问: http://39.108.11.214:8001"

  # ==================== 阶段6: 发送通知 ====================
  notify:
    name: 发送通知
    runs-on: ubuntu-latest
    needs: [code-review, deploy]
    if: always()
    steps:
      - name: 钉钉通知
        if: secrets.DINGTALK_WEBHOOK != ''
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            STATUS="✅ 部署成功"
          else
            STATUS="❌ 部署失败"
          fi
          
          curl -s -X POST "${{ secrets.DINGTALK_WEBHOOK }}" \
            -H 'Content-Type: application/json' \
            -d "{
              \"msgtype\": \"markdown\",
              \"markdown\": {
                \"title\": \"GOGO-shop CI/CD 通知\",
                \"text\": \"### 🚀 GOGO-shop CI/CD 报告\n\n**状态**: $STATUS\n\n**Commit**: \`${{ github.sha }}\`\n\n**作者**: ${{ github.actor }}\n\n🔗 GitHub: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
              }
            }"

      - name: 邮件通知
        if: secrets.EMAIL_TO != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 465
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          to: ${{ secrets.EMAIL_TO }}
          subject: "[GOGO-shop] CI/CD ${{ job.status }}"
          html_body: "<h2>GOGO-shop CI/CD 报告</h2><p>状态: ${{ job.status }}</p><p>Commit: <code>${{ github.sha }}</code></p>"
        continue-on-error: true
