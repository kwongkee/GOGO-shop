# GOGO-shop Docker Compose - 本地测试环境
version: '3.8'

services:
  # Laravel应用
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gogo-shop
    ports:
      - "8080:80"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=gogo_shop
      - DB_USERNAME=gogo_user
      - DB_PASSWORD=gogo_pass_2024
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
    volumes:
      - .:/var/www/html
      - ./storage/logs:/var/www/html/storage/logs
    depends_on:
      - mysql
      - redis
    networks:
      - gogo-network
    restart: unless-stopped

  # MySQL数据库
  mysql:
    image: mysql:5.7
    container_name: gogo-shop-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root_password_2024
      - MYSQL_DATABASE=gogo_shop
      - MYSQL_USER=gogo_user
      - MYSQL_PASSWORD=gogo_pass_2024
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - gogo-network
    restart: unless-stopped

  # Redis缓存
  redis:
    image: redis:6-alpine
    container_name: gogo-shop-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - gogo-network
    restart: unless-stopped

  # phpMyAdmin（可选，用于数据库管理）
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: gogo-shop-phpmyadmin
    environment:
      - PMA_HOST=mysql
      - PMA_USER=root
      - PMA_PASSWORD=root_password_2024
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - gogo-network
    restart: unless-stopped
    profiles:
      - tools  # 使用 docker-compose --profile tools 启动

volumes:
  mysql_data:
  redis_data:

networks:
  gogo-network:
    driver: bridge
